[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradum"
version = "0.4.0"
description = "A local-first AI coding agent with function calling, powered by Ollama."
readme = "docs/ARCHITECTURE_en.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gradum Authors" }]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
gradum = "gradum.agent:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gradum*"]

[tool.setuptools.package-data]
gradum = ["prompts/*.md"]
