[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradum"
version = "0.6.0"
description = "A local-first AI coding agent with function calling, powered by Ollama and OpenAI-compatible APIs."
readme = "docs/ARCHITECTURE_en.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gradum Authors" }]
dependencies = [
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
gradum = "gradum.agent:main"
gradum-server = "gradum.server.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gradum*"]

[tool.setuptools.package-data]
gradum = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP024", # IOError alias — project uses (IOError, OSError) by convention
    "UP015", # unnecessary "r" mode — kept for readability
    "UP045", # X | None syntax — requires from __future__ import annotations (not used everywhere)
]

[tool.ruff.lint.isort]
known-first-party = ["gradum"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
