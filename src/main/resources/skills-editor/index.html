<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Gradum Workspace</title>
    <link href="/skills/editor/assets/color_logo.svg" rel="icon" sizes="any" type="image/svg+xml"/>
    <link href="/skills/editor/assets/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
    <link href="/skills/editor/assets/apple-touch-icon-180.png" rel="apple-touch-icon" sizes="180x180"/>
    <link href="/skills/editor/styles/tokens.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/base.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/layout.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/components.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/chat.css" rel="stylesheet"/>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  (function () {
    // Keep this key in sync with core/storageKeys.js; this runs before modules load.
    let preference = null;
    try {
      preference = window.localStorage.getItem("gradum.skillsEditor.theme");
    } catch (storageError) {
      preference = null;
    }
    if (preference !== "light" && preference !== "dark" && preference !== "system") {
      preference = "dark";
    }
    if (preference === "system") {
      preference = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }

    let layout = null;
    try {
      layout = JSON.parse(window.localStorage.getItem("gradum.skillsEditor.layout") || "null");
    } catch (layoutError) {
      layout = null;
    }
    let canvasRoot = document.getElementById("canvas");

    let pick = function (key, allowed, fallback) {
      let stored = layout && layout[key];
      return allowed.indexOf(stored) === -1 ? fallback : stored;
    };

    canvasRoot.style.setProperty(
      "--ui-scale", String(pick("uiScale", [0.9, 1, 1.1, 1.25], 1)),
    );
    canvasRoot.style.setProperty(
      "--ui-font-ratio", String(pick("uiFontSize", [12, 13, 14, 15, 16], 14) / 14),
    );
    canvasRoot.style.setProperty(
      "--code-font-ratio", String(pick("codeFontSize", [12, 13, 14, 15, 16, 17, 18], 13) / 13),
    );
    canvasRoot.style.setProperty("--tab-width", String(pick("tabWidth", [2, 4], 4)));
    canvasRoot.dataset.theme = preference;
    if (layout && layout.performanceMode === true) {
      canvasRoot.dataset.motion = "off";
    }
    canvasRoot.classList.add("is-booting");
  })();
</script>
<script id="starterTemplate" type="text/plain">
</script>
<script src="/skills/editor/main.js" type="module"></script>
</body>
</html>
