<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Gradum Workspace</title>
    <link href="/skills/editor/styles/tokens.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/base.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/layout.css" rel="stylesheet"/>
    <link href="/skills/editor/styles/components.css" rel="stylesheet"/>
    <script>
      (function () {
        let preference = null;
        try {
          preference = window.localStorage.getItem("gradum.skillsEditor.theme");
        } catch (storageError) {
          preference = null;
        }
        if (preference !== "light" && preference !== "dark") preference = "dark";
        document.documentElement.dataset.theme = preference;
        // Held until the first frame is painted, so the layout the script
        // restores from storage does not animate in from the defaults.
        document.documentElement.classList.add("is-booting");
      })();
    </script>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script id="starterTemplate" type="text/plain">
</script>
<script src="/skills/editor/main.js" type="module"></script>
</body>
</html>
