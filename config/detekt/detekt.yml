# Gradum detekt configuration
#
# This file is loaded by the detekt Gradle plugin in both modules
# (root `build.gradle.kts` and `plugin/build.gradle.kts`). New lint
# rules MUST be paired with an entry in
# `docs/CODING_STANDARDS_KOTLIN.md` — see §23 "Lint Enforcement".
#
# Conventions:
# - `active: true` means the rule is enforced.
# - `active: false` means the rule is off (left in the file for
#   discoverability and to make the diff easy to flip).
# - `severity` is the baseline. Specific findings can still be
#   raised in code review; do not duplicate the rule's job.
# - Numeric thresholds that match the human-readable rule in
#   `docs/CODING_STANDARDS_KOTLIN.md` should match exactly — change
#   both at the same time.

build:
  # The Gradle plugin's own `--max-issues` flag (set in
  # `build.gradle.kts`) is the build-failing gate. The value here
  # is a *soft* progress tracker: the baseline XML records every
  # current violation, and detekt fails when the un-baselined count
  # exceeds this number. The initial value (`10000`) accommodates
  # the legacy codebase's full violation count (~8,400) with a
  # comfortable headroom; tighten as issues are fixed and removed
  # from the baseline.
  maxIssues: 10000
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

output-reports:
  active: true

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false  # we don't require a license header
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: false
  KDocReferencesNonPublicProperty:
    active: false
  OutdatedDocumentation:
    active: false
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  LabeledExpression:
    active: false
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    # §15 / §21 single-line function bodies keep this from being a
    # problem in well-factored code. Threshold matches "≈50 lines of
    # logic", generous for plumbing methods.
    active: true
    threshold: 50
  LongParameterList:
    active: true
    functionThreshold: 5
    constructorThreshold: 5
    ignoreDefaultParameters: false
    ignoreDataClasses: true
  MethodOverloading:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 4
  StringLiteralDuplication:
    active: false
  TooManyFunctions:
    # §22. Default `thresholdInClasses: 20` is the public-method
    # ceiling. `thresholdInInterfaces` and `thresholdInObjects` are
    # lower because interfaces/objects tend to be more focused.
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    # Allow `catch (ioException: IOException) { /* ignore */ }` only
    # when the variable name is `ignore` — detekt's stock convention.
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected)'
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKtFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
    methodNames:
      - 'equals'
      - 'finalize'
      - 'hashCode'
      - 'toString'
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
    ignoreLabeled: false
  SwallowedException:
    # Catches that swallow the cause silently (no rethrow, no logger
    # call, no Result.failure return) are flagged. Combined with
    # §20 "catch must call logger", this enforces the rule.
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'MalformedURLException'
    allowedExceptionNameRegex: '_|(ignore|expected)'
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    # We catch specific exceptions by class (see §20) and rethrow
    # generic Exception is rare in our domain code. Allow it for
    # top-level guards only.
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalArgumentException'
      - 'IllegalMonitorStateException'
      - 'IllegalStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected)'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'RuntimeException'
      - 'Throwable'

naming:
  active: true
  BooleanPropertyNaming:
    # §2.4: Boolean vars must start with a predicate prefix.
    active: true
    allowedPattern: '^(is|has|can|should|will|must|need)'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    privateParameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$Companion'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
  FunctionMaxLength:
    # Test names are deliberately descriptive (e.g. "strikethrough
    # accumulates with bold — both styles apply"). 50 chars is too
    # tight for the chat test fixtures, and these names document
    # edge cases that have bitten us before — we'd rather read the
    # long name than guess from a 47-char abbreviation.
    active: true
    maximumFunctionNameLength: 60
  FunctionMinLength:
    active: true
    minimumFunctionNameLength: 3
  FunctionNaming:
    # §2.3 + §2.4: Functions ≥ 3 chars; Compose @Composable funcs are
    # PascalCase and use a separate rule. KDoc on the rule lists the
    # exact regex used.
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$Companion'
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$Companion'
  InvalidPackageDeclaration:
    active: true
  MatchingDeclarationName:
    active: true
  MemberNameEqualsClassName:
    active: true
  NoNameShadowing:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true
  ObjectPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '(_)?[A-Za-z][_A-Za-z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
  TopLevelPropertyNaming:
    # §2.3: Top-level `val FOO_BAR = ...` is the convention for
    # compile-time constants; everything else is camelCase.
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableMaxLength:
    active: true
    maximumVariableNameLength: 50
  VariableMinLength:
    # §2.3: Enforce a 3-character minimum. The "two-word" rule
    # itself is a soft convention enforced by review — this catches
    # the worst offenders (`id`, `e`, `x`).
    active: true
    minimumVariableNameLength: 3
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$Companion'

performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  DoubleMutabilityForCollection:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: false
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExitOutsideMain:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  ImplicitUnitReturnType:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  LateinitUsage:
    active: false
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingPackageDeclaration:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: false
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

style:
  active: true
  AlsoCouldBeApply:
    active: true
  BracesOnIfStatements:
    # §9 / §21: single-line `if` / `for` / `while` MUST NOT have
    # braces. detekt's `BracesOnIfStatements` rule is "must have
    # braces" — we turn it OFF. detekt's `UnlessBraces` companion
    # rule is "must have braces when multi-line" — we turn that ON.
    active: false
  BracesOnWhenStatements:
    active: false
  CanBeNonNullable:
    active: true
  CascadingCallWrapping:
    active: false
  ClassOrdering:
    active: false
  CollapsibleIfStatements:
    active: false
  DataClassContainsFunctions:
    active: false
  DataClassShouldBeImmutable:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 3
  EqualsNullCall:
    active: true
  EqualsOnSignatureLine:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: false
  ExplicitItLambdaParameter:
    active: true
  ExpressionBodySyntax:
    active: false
  ForbiddenComment:
    # We use `// TODO(name): ...` freely; detekt's stock word list is
    # too aggressive.
    active: false
  ForbiddenImport:
    active: false
  ForbiddenMethodCall:
    active: false
  ForbiddenSuppress:
    active: false
  ForbiddenVoid:
    active: false
  FunctionOnlyReturningConstant:
    active: true
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 1
  MagicNumber:
    # We use named constants in domain code (§2) and inline numbers
    # in tests; keep this off in tests via the `excludes` glob.
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '1000'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: false
    ignoreExtensionFunctions: true
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    # editorconfig says 120 — we keep detekt slightly looser (200)
    # because Compose Modifier chains read better as one line.
    active: true
    maxLineLength: 200
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  MultilineLambdaItParameter:
    active: false
  NestedClassesVisibility:
    active: true
  NewLineAtEndOfFile:
    active: true
  NoTabs:
    active: true
  NullableBooleanCheck:
    active: true
  ObjectLiteralToLambda:
    active: true
  OptionalAbstractKeyword:
    active: true
  OptionalUnit:
    active: false
  PreferToOverPairSyntax:
    active: false
  ProtectedMemberInFinalClass:
    active: true
  RedundantExplicitType:
    active: false
  RedundantHigherOrderMapUsage:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  SafeCast:
    active: true
  SerialVersionUIDInSerializableClass:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  ThrowsCount:
    active: true
    max: 2
  TrailingWhitespace:
    active: true
  TrimMultilineRawString:
    active: false
  UnderscoresInNumericLiterals:
    active: false
  UnnecessaryAbstractClass:
    active: true
  UnnecessaryAnnotationUseSiteTarget:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryFilter:
    active: true
  UnnecessaryInheritance:
    active: true
  UnnecessaryInnerClass:
    active: false
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: false
  UntilInsteadOfRangeTo:
    active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  UseAnyOrNoneInsteadOfFind:
    active: true
  UseArrayLiteralsInAnnotations:
    active: true
  UseCheckNotNull:
    active: true
  UseCheckOrError:
    active: true
  UseDataClass:
    active: false
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseIfInsteadOfWhen:
    active: false
  UseIsNullOrEmpty:
    active: true
  UseLet:
    active: true
  UseOrEmpty:
    active: true
  UseRequire:
    active: true
  UseRequireNotNull:
    active: true
  UseSumOfInsteadOfFlatMapSize:
    active: true
  UselessCallOnNotNull:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true

formatting:
  active: true
  android: false
  autoCorrect: true
  AnnotationOnSeparateLine:
    active: false
  AnnotationSpacing:
    active: true
  ArgumentListWrapping:
    active: true
  BackingPropertyNaming:
    active: true
  BinaryOperationWrapping:
    active: true
  BlankLineBeforeEaDoc:
    active: true
  BlankLines:
    active: true
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  CallableReferenceAfterLambda:
    active: true
  ChainMethodContinuation:
    active: true
  ChainWrapping:
    active: true
  ClassBodyFormatting:
    active: true
  ClassSignature:
    active: false
  CommentSpacing:
    active: true
  CompactControlFlowLoops:
    active: true
  ConditionallySpeech:
    active: true
  ContextReceiverMapping:
    active: true
  DiscouragedCommentLocation:
    active: true
  EnumEntryNameCase:
    active: true
  EnumWrapping:
    active: true
  Filename:
    active: true
  FinalNewline:
    active: true
  FunKeywordSpacing:
    active: true
  FunctionExpressionBody:
    active: true
  FunctionSignature:
    # §21: Single-statement function bodies go on the same line as
    # the signature. detekt-formatting's `FunctionSignature` rule
    # enforces the opposite ("body on new line unless it doesn't
    # fit"), so we disable it here and rely on the Kotlin
    # formatter / IntelliJ default to handle it.
    active: false
  FunctionTypeReferenceSpacing:
    active: true
  IfElseBracing:
    # Inverse of `BracesOnIfStatements`. When multi-line, MUST have
    # braces; when single-line, MUST NOT. Pairs with the
    # `formatting.BracesOnIfStatements: false` setting above.
    active: true
  IfElseWrapping:
    active: true
  ImportOrdering:
    active: true
  Indentation:
    # §2.2: The project uses 2-space indent (see .editorconfig).
    # detekt-formatting's Indentation rule defaults to 4 spaces, so
    # without this override every Kotlin file trips a cascade of
    # "should be 4" false positives.
    active: true
    indentSize: 2
    continuationIndentSize: 4
  KdocWrapping:
    active: true
  MaximumLineLength:
    # §2.1: The project line width is 200 (see .editorconfig). The
    # detekt-formatting rule defaults to 120 and doesn't read
    # .editorconfig reliably, so we mirror the value here.
    active: true
    maxLineLength: 200
  ModifierListSpacing:
    active: true
  MultiLineIfElse:
    active: true
  NoBlankLineBeforeRbrace:
    active: true
  NoConsecutiveBlankLines:
    active: true
  NoConsecutiveComments:
    active: true
  NoEmptyClassBody:
    active: true
  NoEmptyFirstLineInMethodBlock:
    active: true
  NoLineBreakAfterElse:
    active: true
  NoLineBreakBeforeAssignment:
    active: true
  NoMultipleSpaces:
    active: true
  NoSemicolons:
    active: true
  NoSingleLineBlockComment:
    active: true
  NoTrailingSpaces:
    active: true
  NoUnitReturn:
    active: true
  NoUnusedImports:
    active: true
  NoWildcardImports:
    active: true
  NullableTypeSpacing:
    active: true
  PackageName:
    active: true
  ParameterListSpacing:
    active: true
  ParameterListWrapping:
    active: true
  PropertyDeclarationInInterface:
    active: true
  PropertyWrapping:
    active: true
  SpacingAroundAngleBrackets:
    active: true
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundDot:
    active: true
  SpacingAroundDoubleColon:
    active: true
  SpacingAroundForControlFlowKeywords:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperators:
    active: true
  SpacingAroundParens:
    active: true
  SpacingAroundRangeOperator:
    active: true
  SpacingAroundUnaryOperator:
    active: true
  SpacingBetweenDeclarationsWithAnnotations:
    active: true
  SpacingBetweenDeclarationsWithComments:
    active: true
  SpacingBetweenFunctionNameAndOpeningParenthesis:
    active: true
  StringTemplate:
    active: true
  StringTemplateIndent:
    # The codebase uses indented raw strings with `.trimIndent()`
    # (the `| column 0` convention for test fixtures). detekt's
    # StringTemplateIndent rule expects flush-left content, so it
    # fires on every indented raw string in tests. Disable it.
    active: false
  TrailingCommaOnCallSite:
    # Disabled in detekt-formatting 1.23.7: the rule crashes with
    # `Sequence contains no element matching the predicate` on
    # Kotlin 2.3 AST for `when` entries. Re-enable once the upstream
    # bug is fixed.
    active: false
  TrailingCommaOnDeclarationSite:
    # Same bug as TrailingCommaOnCallSite — see above.
    active: false
  TryClauseLocation:
    active: true
  TypeArgumentListSpacing:
    active: true
  TypeParameterListSpacing:
    active: true
  UnnecessaryParenthesesBeforeTrailingLambda:
    active: true
  UntilInsteadOfRangeTo:
    active: true
  UnusedImport:
    active: true
  UseCheckNotNull:
    active: true
  UseEmptyCounterpart:
    active: true
  UseSumOfInsteadOfFlatMapSize:
    active: true
  UselessCallOnNotNull:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true
  Wrapping:
    # Disabled: ktlint WrappingRule crashes with NPE at
    # WrappingRule.rearrangeBlock on certain AST patterns (ktlint bug).
    active: false

# detekt's `test:` block is not a valid top-level section in 1.23.x;
# test-only rule relaxations are configured per-test-source-set via
# the `excludes` glob in the rule itself, or in
# `plugin/build.gradle.kts`'s `detekt { }` block.
