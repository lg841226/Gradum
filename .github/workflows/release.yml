name: Release

# Triggered only by pushing a `v*` tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`).
# Normal pushes to master do not run this workflow. The tag name becomes the
# release version: `v1.1.0` -> `gradum@1.1.0.jar`.

on:
  push:
    tags:
      - 'v*'

# Needs `contents: write` to create the GitHub Release and upload its assets.
permissions:
  contents: write

jobs:
  build-server:
    name: Quality gate + fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # detekt runs via the compile gate, plus explicit `test`, so a failing
      # lint or unit test blocks the release. `:buildFatJar` produces the jar.
      # `:build` is avoided: it pulls in the shadow dist tasks, which fail to
      # configure (`mainClassName` mapping) outside the fatJar path.
      # `-Pgradum.skipPlugin` keeps the plugin module (JDK 25 / aliyun SDK)
      # out of the build graph.
      - name: Build, detekt, and test
        run: ./gradlew :detekt :test :buildFatJar --console=plain \
          -Pgradum.skipPlugin -Pgradum.version="$VERSION" \
          -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: build/libs/gradum@${{ env.VERSION }}.jar
          if-no-files-found: error

  package-macos:
    name: macOS app bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package self-contained app
        run: ./gradlew :serverPackage --console=plain \
          -Pgradum.skipPlugin -Pgradum.version="$VERSION" \
          -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Zip app bundle
        run: |
          cd build/gradum-server
          ditto -c -k --keepParent GradumServer.app "gradum-server-macos-arm64-$VERSION.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/gradum-server/gradum-server-macos-arm64-${{ env.VERSION }}.zip
          if-no-files-found: error

  publish:
    name: Create draft release
    needs: [build-server, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "Gradum Server ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/**/*