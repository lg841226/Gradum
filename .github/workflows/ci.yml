name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # org.gradle.java.home in gradle.properties points at a local dev JDK path
      # that only exists on the author's machine, so we override it on CI with
      # the JDK provisioned above.
      #
      # `-Pgradum.skipPlugin` excludes the plugin module from the build graph
      # entirely (see settings.gradle.kts): it targets JDK 25 and resolves its
      # IntelliJ SDK from an aliyun mirror that is unreliable on CI. The `:`
      # prefixes keep detekt/test pinned to the root project for good measure.
      - name: Detekt and tests
        run: ./gradlew :detekt :test --console=plain -Pgradum.skipPlugin -Dorg.gradle.java.home="$JAVA_HOME"
