gradum.whatsnew.feature1.title=Multi-Model Cloud Access
gradum.whatsnew.feature1.description=Seamlessly connect to **Zhipu**, **DeepSeek**, and **MiniMax**, plus auto-detect \
  your favorite local models. Switch instantly, no complex config needed.
gradum.whatsnew.feature2.title=Git Audit
gradum.whatsnew.feature2.description=**Statistics-driven code audit** across your commit history. Get comprehensive \
  historical insights, all running **locally**, with zero cloud dependency or data leakage risk.
gradum.whatsnew.feature3.title=Permission Modes
gradum.whatsnew.feature3.description=Control agent behavior with three granular permission levels. Start safe, \
  escalate gradually, no worries about accidental changes to critical codebases.
gradum.whatsnew.feature4.title=Powerful Session Management
gradum.whatsnew.feature4.description=**Persist**, **browse**, **search**, **rename**, or **merge** chat sessions \
  across IDE restarts. Your recent conversations stay local forever, pick up right where you left off.
