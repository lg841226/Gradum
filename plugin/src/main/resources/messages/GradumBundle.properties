  on the spot, with permissions granted per server. Straight stdio, running on your machine, \
  nothing sent to a cloud.
gradum.whatsnew.feature2.title=Chat in Editor Tabs
gradum.whatsnew.feature2.description=Open the Gradum chat as a full editor tab via action or by dragging the tool window header. \
  A vertical minimap on the right shows user-message positions, click any bar to jump straight to that turn.
