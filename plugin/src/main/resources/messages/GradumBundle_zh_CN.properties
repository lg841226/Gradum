gradum.whatsnew.feature1.title=多模型云接入
gradum.whatsnew.feature1.description=设置页面无缝接入 **Zhipu**、**DeepSeek** 和 **MiniMax**；也自动发现你所喜爱的本地模型，即刻切换，无需繁琐配置。
gradum.whatsnew.feature2.title=Git 代码审计
gradum.whatsnew.feature2.description=对项目提交历史进行**统计驱动的代码审计**。全方位获取项目的各种历史数据综合分析，全位于**本地环境**运行，无需云端依赖和数据泄漏风险。
gradum.whatsnew.feature3.title=权限模式
gradum.whatsnew.feature3.description=通过三层不同颗粒度的权限控制智能体行为，安全起步，逐级授权，不必担心重要的代码库被意外更改。
gradum.whatsnew.feature4.title=强大的会话管理
gradum.whatsnew.feature4.description=在 IDE 重启之间**持久化**、**浏览**、**搜索**、**重命名**或**合并**聊天会话。最近的对话将永久保存在本地，随时能立刻继续开发。
